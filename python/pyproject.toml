[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcriptyt"
version = "1.0.0"
description = "YouTube Transcript API client: get any YouTube video's transcript as JSON, text, SRT, or VTT in 150+ languages."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["youtube", "transcript", "youtube-transcript", "youtube-transcript-api", "captions", "subtitles", "srt", "vtt", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Homepage = "https://transcript-yt.com"
Documentation = "https://transcript-yt.com/docs"
Repository = "https://github.com/rajdeep-automation/transcriptyt"
